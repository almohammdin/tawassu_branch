  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #ffffff;
      --surface-2: #fbfcfe;
      --ink: #0a0e1a;
      --ink-soft: #25314d;
      --muted: #6b7486;
      --line: #e3e7ee;
      --navy: #0d438d;
      --teal: #17bfd0;
      --gold: #c9a84c;
      --good: #1f8b5f;
      --mid: #d09a21;
      --bad: #c54747;
      --danger-bg: #fff2f2;
      --warn-bg: #fff8e8;
      --good-bg: #eef8f2;
      --shadow: 0 16px 42px rgba(10,14,26,.08);
      --r-xl: 26px;
      --r-lg: 20px;
      --r-md: 14px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(23,191,208,.08), transparent 24%),
        radial-gradient(circle at bottom right, rgba(201,168,76,.08), transparent 22%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
      color: var(--ink);
    }
    img { max-width: 100%; display: block; }
    button, input, select { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1120px, calc(100% - 28px)); margin: 0 auto; }
    .accent { height: 5px; background: linear-gradient(90deg, var(--teal), var(--navy), var(--gold)); }
    .site-header { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(14px); background: rgba(255,255,255,.88); border-bottom: 1px solid rgba(227,231,238,.95); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand img { width: 136px; height: 72px; object-fit: contain; flex: 0 0 auto; }
    .brand-copy strong { display: block; color: var(--ink); font-size: 1.13rem; line-height: 1.35; }
    .brand-copy span { display: block; color: var(--muted); font-size: .88rem; margin-top: 3px; }
    .btn {
      border: 0; cursor: pointer; border-radius: 15px; padding: 13px 18px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px; transition: .18s ease;
    }
    .btn-primary { background: linear-gradient(135deg, var(--navy), #0b356f); color: #fff; box-shadow: 0 12px 24px rgba(13,67,141,.18); }
    .btn-secondary { background: #fff; color: var(--ink-soft); border: 1px solid var(--line); }
    .btn-ghost { background: transparent; color: var(--navy); padding-inline: 0; }
    .btn:hover { transform: translateY(-1px); }
    .hero { padding: 28px 0 18px; }
    .hero-card { background: rgba(255,255,255,.95); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 30px; padding: 26px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 26px; align-items: center; }
    .hero-logo { background: linear-gradient(180deg, rgba(13,67,141,.03), rgba(23,191,208,.03)); border: 1px solid #eef2f7; border-radius: 24px; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 250px; }
    .hero-logo img { width: min(470px, 100%); }
    .hero-copy .eyebrow { display: inline-flex; padding: 8px 12px; border-radius: 999px; background: rgba(13,67,141,.08); color: var(--navy); font-size: .86rem; font-weight: 700; }
    .hero-copy h1 { margin: 14px 0 10px; font-size: clamp(2rem, 4.2vw, 3.1rem); line-height: 1.16; color: var(--ink); }
    .hero-copy p { margin: 0; color: var(--muted); line-height: 1.95; font-size: 1rem; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

    .tool-section { padding: 6px 0 24px; }
    .tool-card { background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
    .tool-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }
    .tool-head h2 { margin: 0; font-size: 1.35rem; color: var(--ink); }
    .tool-head p { margin: 8px 0 0; color: var(--muted); line-height: 1.8; }
    .mode-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .mode-pill { position: relative; border: 1px solid var(--line); border-radius: 18px; padding: 15px 16px; background: var(--surface-2); }
    .mode-pill strong { color: var(--ink); display: block; }
    .mode-pill span { color: var(--muted); font-size: .9rem; display: block; margin-top: 4px; }
    .mode-pill.active { border-color: rgba(13,67,141,.22); background: linear-gradient(180deg, rgba(13,67,141,.05), rgba(23,191,208,.04)); }
    .mode-pill.locked { opacity: .95; padding-top: 54px; }
    .lock-badge { position: absolute; inset-inline-start: 14px; top: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; background: rgba(201,168,76,.18); color: #7c5d11; border: 1px solid rgba(201,168,76,.34); border-radius: 999px; padding: 6px 10px; font-size: .8rem; font-weight: 700; }
    .progress-zone { position: sticky; top: 92px; z-index: 24; margin: 0 14px; padding: 14px 16px; border: 1px solid rgba(201,168,76,.30); border-radius: 16px; background: rgba(255,255,255,.94); box-shadow: 0 12px 30px rgba(10,14,26,.10); backdrop-filter: blur(16px); }
    .tool-card.completed .questions-wrap,
    .tool-card.completed .actions { display: none; }
    .question-title-row { display: flex; align-items: flex-start; gap: 8px; }
    .question-title-row h3 { flex: 1; }
    .tip-wrap { position: relative; flex: 0 0 auto; }
    .tip-btn { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid rgba(201,168,76,.45); border-radius: 50%; background: #fffaf0; color: #806419; cursor: help; font-size: .78rem; font-weight: 700; }
    .tip-box { position: absolute; z-index: 50; top: calc(100% + 8px); inset-inline-end: 0; width: min(410px, calc(100vw - 76px)); padding: 12px 13px; border: 1px solid rgba(201,168,76,.38); border-radius: 12px; background: #fffdf7; color: #596675; box-shadow: 0 14px 34px rgba(10,14,26,.14); font-size: .78rem; line-height: 1.75; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: .16s ease; }
    .tip-wrap:hover .tip-box, .tip-wrap.open .tip-box, .tip-btn:focus + .tip-box { opacity: 1; visibility: visible; transform: translateY(0); }

    .progress-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
    .progress-top .copy strong { display: block; color: var(--ink); }
    .progress-top .copy span { color: var(--muted); font-size: .9rem; }
    .progress-stats { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-weight: 700; }
    .progress-stats b { color: var(--gold); font-size: 1.05rem; }
    .bar-track { height: 14px; border-radius: 999px; background: #edf1f6; overflow: hidden; border: 1px solid #e4eaf1; }
    .bar-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--gold) 0%, #d9bb73 30%, var(--navy) 100%); transition: width .25s ease; }

    .questions-wrap { padding: 20px 24px 12px; }
    .step-hint { color: var(--muted); line-height: 1.8; margin-bottom: 18px; }
    .branch-field { margin-bottom: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-2); }
    .branch-field[hidden] { display: none; }
    .branch-field label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; color: var(--ink); font-weight: 700; }
    .branch-field label small { color: var(--muted); font-size: .78rem; font-weight: 500; }
    .branch-field input { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); outline: none; }
    .branch-field input:focus { border-color: rgba(13,67,141,.48); box-shadow: 0 0 0 3px rgba(13,67,141,.08); }
    .question-list { display: grid; gap: 14px; }
    .question-card { border: 1px solid var(--line); border-radius: 18px; padding: 16px; background: #fff; }
    .question-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .q-badge { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, rgba(13,67,141,.1), rgba(23,191,208,.1)); color: var(--navy); font-weight: 800; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .question-head h3 { margin: 0; font-size: 1.05rem; color: var(--ink); line-height: 1.55; }
    .question-head p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.65; }
    .options { display: grid; gap: 10px; }
    .options.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .options.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .choice { min-height: 52px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; text-align: right; transition: .18s ease; }
    .choice strong { color: #566270; display: block; font-size: 13px; font-weight: 500; line-height: 1.5; }
    .choice small { color: var(--muted); display: block; margin-top: 2px; font-size: 11px; font-weight: 400; line-height: 1.4; }
    .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c8d3e0; margin-top: 1px; flex: 0 0 auto; position: relative; }
    .choice:hover { border-color: rgba(13,67,141,.26); transform: translateY(-1px); }
    .choice.selected { border-color: rgba(13,67,141,.34); background: rgba(13,67,141,.05); box-shadow: 0 0 0 3px rgba(13,67,141,.06); }
    .choice.selected .dot { border-color: var(--navy); }
    .choice.selected .dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--navy); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 0 24px 24px; }
    .actions .meta { color: var(--muted); font-size: .9rem; }
    .actions .group { display: flex; gap: 10px; flex-wrap: wrap; }

    .results { display: none; border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(13,67,141,.02), transparent); }
    .results.show { display: block; }
    .result-inner { padding: 24px; }
    .result-grid { display: grid; grid-template-columns: 1.02fr .98fr; gap: 16px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
    .risk-chip { display: inline-flex; padding: 8px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; }
    .risk-good { background: var(--good-bg); color: var(--good); }
    .risk-mid { background: var(--warn-bg); color: #9f7300; }
    .risk-bad { background: var(--danger-bg); color: var(--bad); }
    .score-block { display: flex; justify-content: space-between; gap: 14px; align-items: start; flex-wrap: wrap; margin-top: 14px; }
    .score-no { font-size: 3.4rem; line-height: 1; color: var(--navy); font-weight: 800; }
    .score-copy h4 { margin: 0 0 8px; color: var(--ink); font-size: 1.28rem; }
    .score-copy p { margin: 0; color: var(--muted); line-height: 1.85; }
    .result-branch { width: fit-content; margin-bottom: 12px; padding: 7px 11px; border-radius: 999px; background: rgba(13,67,141,.07); color: var(--navy); font-size: .88rem; font-weight: 700; }
    .result-branch[hidden] { display: none; }
    .risk-scale { margin-top: 20px; }
    .risk-scale .head { display: flex; justify-content: space-between; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; gap: 12px; }
    .scale-track { position: relative; height: 14px; border-radius: 999px; overflow: hidden; background: linear-gradient(270deg, #1f8b5f 0 25%, #d09a21 25% 55%, #c54747 55% 100%); }
    .pointer { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.18); }
    .scale-labels { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); margin-top: 8px; }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
    .fact { border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); padding: 14px; }
    .fact span { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 6px; }
    .fact strong { color: var(--ink); font-size: 1rem; }
    .blockers { display: none; margin-top: 18px; background: var(--danger-bg); border: 1px solid #f2c9c9; border-radius: 18px; padding: 15px 16px; }
    .blockers.show { display: block; }
    .blockers strong { color: #992f2f; display: block; }
    .blockers ul { margin: 10px 0 0; padding-right: 18px; color: #8b3737; line-height: 1.8; }
    .axis-list { display: grid; gap: 12px; }
    .axis-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .axis-head { display: flex; justify-content: space-between; gap: 12px; color: var(--ink); font-weight: 700; margin-bottom: 8px; }
    .axis-track { height: 10px; background: #edf1f6; border-radius: 999px; overflow: hidden; }
    .axis-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--navy)); transition: width .25s ease; }
    .lists { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
    .list-panel h5 { margin: 0 0 10px; font-size: 1rem; color: var(--ink); }
    .list-panel ul { margin: 0; padding-right: 18px; color: var(--muted); line-height: 1.85; display: grid; gap: 8px; }
    .result-actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

    .site-footer { padding: 8px 0 36px; }
    .footer-card { background: rgba(255,255,255,.96); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 24px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .footer-main { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .footer-main img { width: 126px; height: auto; }
    .footer-copy strong { display: block; color: var(--ink); }
    .footer-copy span { display: block; color: var(--muted); font-size: .88rem; margin-top: 3px; }
    .footer-social { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .footer-social strong { direction: ltr; font-size: .95rem; color: var(--ink-soft); }
    .footer-social a { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; }
    .footer-social svg { width: 18px; height: 18px; fill: currentColor; }

    .preview-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(10,14,26,.66); display: grid; place-items: center; padding: 16px; }
    .preview-overlay[hidden] { display: none; }
    .preview-card { width: min(1100px, 100%); max-height: 92vh; overflow: auto; background: #fff; border-radius: 22px; box-shadow: 0 28px 70px rgba(0,0,0,.26); padding: 16px; }
    .preview-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .preview-head h4 { margin: 0; color: var(--ink); }
    .preview-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .preview-image { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
    .preview-image img { width: 100%; height: auto; }

    .toast { position: fixed; inset-inline-start: 20px; bottom: 20px; background: rgba(10,14,26,.94); color: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 18px 34px rgba(10,14,26,.26); opacity: 0; transform: translateY(12px); transition: .18s ease; z-index: 90; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 980px) {
      .hero-card, .result-grid, .lists, .mode-bar { grid-template-columns: 1fr; }
      .facts { grid-template-columns: repeat(2, 1fr); }
    }
