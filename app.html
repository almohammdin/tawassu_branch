<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توسّع | أداة تقييم قرارات توسع الفروع</title><link rel="icon" type="image/png" href="logo.png"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fc}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="index.html" title="أداة توسّع"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const css=d.createElement('style');css.textContent='.brand img{width:150px!important;height:105px!important;object-fit:contain!important;padding:10px!important;overflow:visible!important}.logoCard img{width:min(500px,100%)!important;max-height:370px!important;object-fit:contain!important;padding:20px!important}.brand,.topin{overflow:visible!important}.sar-official{width:17px;height:19px;object-fit:contain;vertical-align:middle;margin-inline-start:5px;display:inline-block}@media(max-width:800px){.brand img{width:125px!important;height:92px!important}}';d.head.appendChild(css);const url='https://upload.wikimedia.org/wikipedia/commons/9/98/Saudi_Riyal_Symbol.svg';const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())if(w.currentNode.nodeValue.includes('﷼'))nodes.push(w.currentNode);nodes.forEach(n=>{const parts=n.nodeValue.split('﷼');const frag=d.createDocumentFragment();parts.forEach((p,i)=>{frag.appendChild(d.createTextNode(p));if(i<parts.length-1){const img=d.createElement('img');img.src=url;img.alt='رمز الريال السعودي';img.className='sar-official';frag.appendChild(img)}});n.parentNode.replaceChild(frag,n)});const icon=d.querySelector('link[rel="icon"]')||d.createElement('link');icon.rel='icon';icon.type='image/png';icon.href='logo.png';if(!icon.parentNode)d.head.appendChild(icon)});</script></body></html>
